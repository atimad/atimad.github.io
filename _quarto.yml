          - posts/RAG/index.qmd
          - posts/Syncthing Data Science Friendly/index.qmd
          - posts/A_B Test/index.qmd
          - posts/Computer Vision/index.qmd
          - posts/Dynamic Hotel Pricing Optimization/index.qmd
          - posts/cycles-analysis/index.qmd
